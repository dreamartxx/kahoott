name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Install Dependencies
        run: npm ci

      - name: ⚙️ Build Application
        run: npm run build
        env:
          VITE_HOSTINGER_URL: https://grey-cassowary-525647.hostingersite.com

      - name: 🌐 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: ./dist/

      - name: 🔔 Trigger Hostinger Webhook (Optional Auto-Reload)
        if: env.HOSTINGER_WEBHOOK_URL != ''
        env:
          HOSTINGER_WEBHOOK_URL: ${{ secrets.HOSTINGER_WEBHOOK_URL }}
        run: |
          curl -X POST "$HOSTINGER_WEBHOOK_URL" || echo "Webhook trigger completed"
